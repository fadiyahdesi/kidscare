{% extends 'layout/app.html' %}

{% block title %}Daftar | KidsCare{% endblock %}

{% block content %}
<section class="register-section">

    <div class="register-header">
        <h2>Daftar Akun Baru</h2>
        <p>Harap isi data dengan benar</p>
    </div>

    <form method="POST" action="{{ url_for('main.register') }}" class="register-form">

        <div class="form-grid">

            <!-- Nama Orang Tua -->
            <div class="form-group">
                <label>
                    Nama Orang Tua / Wali
                    <span class="required">*</span>
                </label>
                <input
                    type="text"
                    name="parent_name"
                    placeholder="Masukkan nama orang tua / wali"
                    required
                >
            </div>

            <!-- Nama Anak -->
            <div class="form-group">
                <label>
                    Nama Lengkap Anak
                    <span class="required">*</span>
                </label>
                <input
                    type="text"
                    name="child_name"
                    placeholder="Masukkan nama lengkap anak"
                    required
                >
            </div>

            <!-- Kontak -->
            <div class="form-group">
                <label>
                    Email / Nomor WhatsApp
                    <span class="required">*</span>
                </label>
                <input
                    type="text"
                    name="contact"
                    placeholder="Email atau nomor WhatsApp aktif"
                    required
                >
            </div>

            <!-- Tanggal Lahir -->
            <div class="form-group">
                <label>
                    Tanggal Lahir Anak
                    <span class="required">*</span>
                </label>
                <input
                    type="date"
                    name="child_birth"
                    required
                >
            </div>

            <!-- Alamat -->
            <div class="form-group">
                <label>
                    Alamat Orang Tua / Wali
                    <span class="required">*</span>
                </label>
                <input
                    type="text"
                    name="address"
                    placeholder="Masukkan alamat lengkap"
                    required
                >
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>
                    Jenis Kelamin Anak
                    <span class="required">*</span>
                </label>
                <select name="gender" required>
                    <option value="">-- Pilih Jenis Kelamin --</option>
                    <option value="L">Laki-laki</option>
                    <option value="P">Perempuan</option>
                </select>
            </div>

        </div>

        <button type="submit" class="btn-register">
            Daftar
        </button>

        <p class="login-link">
            Sudah punya akun?
            <a href="{{ url_for('main.login') }}" style="color: #2ec4c4; text-decoration: none; font-weight: 600;">Masuk</a>
        </p>

    </form>

</section>
{% endblock %}
