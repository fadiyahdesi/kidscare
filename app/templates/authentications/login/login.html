{% extends "layout/app.html" %}

{% block title %}Masuk - KidsCare{% endblock %}

{% block content %}
<section class="login-wrapper">
    <div class="login-card">

        <!-- LEFT FORM -->
        <div class="login-form">
            <h2>Selamat Datang Kembali,</h2>
            <p class="subtitle">Silakan masuk menggunakan akun Anda</p>

            <form method="POST" action="{{ url_for('main.login') }}">

                <div class="form-group">
                    <label>
                        Email / No. WhatsApp <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        name="username"
                        placeholder="Masukkan email atau nomor WhatsApp"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>
                        Kata Sandi <span class="required">*</span>
                    </label>
                    <input
                        type="password"
                        name="password"
                        placeholder="Masukkan kata sandi"
                        required
                    >
                </div>

                <a href="#" class="forgot">Lupa Kata Sandi?</a>

                <button type="submit" class="btn-login">
                    Masuk
                </button>
            </form>

            <p class="register-text">
                Belum punya akun?
                <a href="{{ url_for('main.register') }}">Daftar</a>
            </p>
        </div>

        <!-- RIGHT IMAGE -->
        <div class="login-image">
            <img src="{{ url_for('static', filename='images/login.png') }}" alt="KidsCare">
        </div>

    </div>
</section>
{% endblock %}
