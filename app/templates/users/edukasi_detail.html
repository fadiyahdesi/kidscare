{% extends 'layout/dashboard.html' %}

{% block content %}

    <article class="edukasi-detail-card">
        <div class="edukasi-header">
            <span class="edukasi-tag">Edukasi ADHD</span>
            <h1>{{ edukasi.title }}</h1>
        </div>

        <div class="edukasi-content">

        <div class="edukasi-footer">
            <a href="{{ url_for('user.index') }}" class="btn-back">

        </div>
    </article>

</section>

{% endblock %}
