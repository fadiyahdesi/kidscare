<script>
    /**
     * Logic Sidebar Toggle
     */
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const body = document.body;
        const isDesktop = window.innerWidth >= 1024;

        if (isDesktop) {
            sidebar.classList.toggle('sidebar-closed');
            if (sidebar.classList.contains('sidebar-closed')) {
                body.classList.add('sidebar-is-closed');
            } else {
                body.classList.remove('sidebar-is-closed');
            }
        } else {
            if (sidebar.style.transform === 'translateX(0px)' || sidebar.style.transform === 'none' || !sidebar.style.transform) {
                sidebar.style.transform = 'translateX(-100%)';
            } else {
                sidebar.style.transform = 'translateX(0px)';
            }
        }
    }
</script>

<style>
    /* Scrollbar minimalis untuk tema gelap */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    
    @media (max-width: 1023px) {
        #sidebar { transform: translateX(-100%); }
    }
    
    #sidebar.sidebar-closed { transform: translateX(-100%) !important; }
</style>
